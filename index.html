<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت V2Ray</title>

<style>
body {
    background: #101827;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}

.box {
    background: #1e293b;
    padding: 20px;
    margin: 15px auto;
    border-radius: 12px;
    max-width: 400px;
}

h1 {
    color: #38bdf8;
}

button {
    background: #0284c7;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
}
</style>
</head>

<body>

<h1>پنل مدیریت V2Ray</h1>

<div class="box">
<h2>خوش آمدید</h2>
<p>سیستم مدیریت کاربران</p>
</div>

<div class="box">
<h3>وضعیت سرور</h3>
<p>هنوز متصل نشده است</p>
</div>

<div class="box">
<h3>مدیریت کاربران</h3>
<button>مشاهده کاربران</button>
</div>

<div class="box">
<h3>تنظیمات پنل</h3>
<button>تنظیمات</button>
</div>

</body>
</html>
